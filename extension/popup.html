<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Lamaran Tracker</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <h1>Lamaran Tracker</h1>
        <p>Simpan lowongan yang sedang dibuka ke Google Sheets.</p>
      </header>

      <section aria-labelledby="sheet-heading">
        <h2 id="sheet-heading">Tujuan penyimpanan</h2>
        <label for="apps-script-url">URL web app Apps Script</label>
        <input id="apps-script-url" type="url" placeholder="https://script.google.com/macros/s/…/exec" autocomplete="off" spellcheck="false" aria-describedby="sheet-help" disabled>
        <p id="sheet-help" class="hint">URL tujuan tersimpan otomatis. Buka halaman detail lowongan, lalu klik Simpan.</p>
      </section>

      <button id="save-job" class="primary" type="button" disabled>Simpan ke Spreadsheet</button>
      <p id="save-status" class="status" role="status" aria-live="polite"></p>
    </main>
  </body>
</html>
